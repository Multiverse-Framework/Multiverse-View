<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Multiverse View</title>
    <style>
        body {
            margin: 0;
            position: relative;
        }

        .uploadButton {
            position: absolute;
            /* Position the button absolutely */
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            padding: 10px 24px;
            border: none;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            transition-duration: 0.4s;
            border-radius: 8px;
        }

        .uploadButton:hover {
            background-color: white;
            color: black;
        }

        .downloadButton {
            position: absolute;
            /* Position the button absolutely */
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            padding: 10px 24px;
            border: none;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 100px;
            transition-duration: 0.4s;
            border-radius: 8px;
        }

        .downloadButton:hover {
            background-color: white;
            color: black;
        }
    </style>
</head>

<body>
    <input type="file" id="fileInput" style="display: none;" />
    <label for="fileInput" class="uploadButton">Upload</label>
    <button id="downloadBtn" class="downloadButton">Download</button>

    <script type="module" src="/main.js"></script>
</body>

</html>
